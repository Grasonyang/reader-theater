<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader Theater – Comic</title>
    <script type="module" crossorigin src="/reader-theater/assets/comic-BNdkPXzc.js"></script>

    <link rel="stylesheet" crossorigin href="/reader-theater/assets/comic-D1JFqW3w.css">

    <div id="stage">
      <div id="bg-a" class="bg"></div>
